colorScheme = "carolina"
logo = "img/icon.png"
defaultAppearance = "light"
autoSwitchAppearance = true
defaultSocialImage = "img/social.jpg"

enableSearch = true
enableCodeCopy = true

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  # "Selected work" on the homepage: projects with `featured: true` in front matter
  # (see layouts/partials/recent-articles/main.html)
  showRecent = true
  showRecentItems = 3
  cardView = true

[article]
  # Projects show a period (front matter `period`) in the facts box instead of a date
  showDate = false
  showDateUpdated = false
  showAuthor = false
  showBreadcrumbs = true
  showReadingTime = false
  showWordCount = false
  showTableOfContents = true
  showPagination = true
  showTaxonomies = true
  sharingLinks = []

[list]
  showBreadcrumbs = false
  showSummary = true
  showCards = true
  groupByYear = false

[umamiAnalytics]
  websiteid = "273c4fa3-d3ba-45c7-a4e9-b2aae212af22"
  domain = "cloud.umami.is"
  dataDomains = "carolinafaccin.github.io"

[verification]
